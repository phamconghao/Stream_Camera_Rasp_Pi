<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập - Camera Admin</title>
<style>
  body {
    background: #111;
    color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 24px;
    max-width: 360px;
    margin: 80px auto 0;
  }
  h1 { font-size: 18px; color: #9aa; margin-bottom: 20px; text-align: center; }
  .card {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    padding: 20px;
  }
  label { display: block; font-size: 12px; color: #888; margin-bottom: 4px; }
  input[type=text], input[type=password] {
    width: 100%;
    background: #111;
    border: 1px solid #2a2a2a;
    color: #eee;
    padding: 10px;
    border-radius: 6px;
    font-size: 14px;
    box-sizing: border-box;
    margin-bottom: 14px;
  }
  .password-wrap { position: relative; }
  .password-wrap input[type=text], .password-wrap input[type=password] {
    padding-right: 40px;
  }
  .toggle-password {
    position: absolute;
    right: 6px;
    top: 0;
    bottom: 14px;
    display: flex;
    align-items: center;
    background: none;
    border: none;
    padding: 0 6px;
    cursor: pointer;
    color: #888;
    width: auto;
  }
  .toggle-password:hover { color: #ccc; }
  .toggle-password svg { width: 18px; height: 18px; display: block; }
  .toggle-password .icon-eye-off { display: none; }
  .toggle-password.showing .icon-eye { display: none; }
  .toggle-password.showing .icon-eye-off { display: block; }
  .remember { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; font-size: 13px; color: #ccc; }
  .remember input { margin: 0; }
  button {
    width: 100%;
    background: #2a2a4a;
    border: 1px solid #4a4a8a;
    color: #cdf;
    padding: 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }
  #error {
    display: none;
    background: #2a1414;
    border: 1px solid #6a2a2a;
    color: #f87171;
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 16px;
  }
  #error.show { display: block; }
</style>
</head>
<body>
  <h1>Camera Admin</h1>
  <div class="card">
    <div id="error">Sai tên đăng nhập hoặc mật khẩu.</div>
    <form method="POST" action="/login">
      <label for="username">Tên đăng nhập</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus>

      <label for="password">Mật khẩu</label>
      <div class="password-wrap">
        <input type="password" id="password" name="password" autocomplete="current-password" required>
        <button type="button" id="togglePassword" class="toggle-password" aria-label="Hiện mật khẩu" tabindex="-1">
          <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 5.06-6.06M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a20.3 20.3 0 0 1-3.22 4.53M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>
            <path d="M1 1l22 22"></path>
          </svg>
        </button>
      </div>

      <div class="remember">
        <input type="checkbox" id="remember" name="remember" value="1" checked>
        <label for="remember" style="display:inline; margin:0;">Nhớ đăng nhập trên thiết bị này</label>
      </div>

      <button type="submit">Đăng nhập</button>
    </form>
  </div>

<script>
// Progressive enhancement only - the form above works fine with JS
// disabled (plain POST /login). This just shows the error banner if
// admin_http_server.cpp redirected here with ?error=1 after a failed
// login attempt.
if (new URLSearchParams(location.search).get('error') === '1') {
  document.getElementById('error').classList.add('show');
}

// Eye icon: toggles the password field between masked/plain text.
// Also progressive enhancement - without JS the field just stays masked.
const passwordInput = document.getElementById('password');
const toggleBtn = document.getElementById('togglePassword');
toggleBtn.addEventListener('click', () => {
  const showing = passwordInput.type === 'text';
  passwordInput.type = showing ? 'password' : 'text';
  toggleBtn.classList.toggle('showing', !showing);
  toggleBtn.setAttribute('aria-label', showing ? 'Hiện mật khẩu' : 'Ẩn mật khẩu');
});
</script>
</body>
</html>
