<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập - Camera Admin</title>
<style>
  body {
    background: #111;
    color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 24px;
    max-width: 360px;
    margin: 80px auto 0;
  }
  h1 { font-size: 18px; color: #9aa; margin-bottom: 20px; text-align: center; }
  .card {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    padding: 20px;
  }
  label { display: block; font-size: 12px; color: #888; margin-bottom: 4px; }
  input[type=text], input[type=password] {
    width: 100%;
    background: #111;
    border: 1px solid #2a2a2a;
    color: #eee;
    padding: 10px;
    border-radius: 6px;
    font-size: 14px;
    box-sizing: border-box;
    margin-bottom: 14px;
  }
  .remember { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; font-size: 13px; color: #ccc; }
  .remember input { margin: 0; }
  button {
    width: 100%;
    background: #2a2a4a;
    border: 1px solid #4a4a8a;
    color: #cdf;
    padding: 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }
  #error {
    display: none;
    background: #2a1414;
    border: 1px solid #6a2a2a;
    color: #f87171;
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 16px;
  }
  #error.show { display: block; }
</style>
</head>
<body>
  <h1>Camera Admin</h1>
  <div class="card">
    <div id="error">Sai tên đăng nhập hoặc mật khẩu.</div>
    <form method="POST" action="/login">
      <label for="username">Tên đăng nhập</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus>

      <label for="password">Mật khẩu</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>

      <div class="remember">
        <input type="checkbox" id="remember" name="remember" value="1" checked>
        <label for="remember" style="display:inline; margin:0;">Nhớ đăng nhập trên thiết bị này</label>
      </div>

      <button type="submit">Đăng nhập</button>
    </form>
  </div>

<script>
// Progressive enhancement only - the form above works fine with JS
// disabled (plain POST /login). This just shows the error banner if
// admin_http_server.cpp redirected here with ?error=1 after a failed
// login attempt.
if (new URLSearchParams(location.search).get('error') === '1') {
  document.getElementById('error').classList.add('show');
}
</script>
</body>
</html>
